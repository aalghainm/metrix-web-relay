<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrix Web - مزامنة المشاريع وحصر الكميات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 1. شاشة تسجيل الدخول عبر الـ QR Code -->
  <div id="authScreen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-200">
      <div class="mb-4">
        <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-full mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">ربط Metrix Web</h1>
        <p class="text-sm text-slate-500 mt-1">افتح تطبيق Metrix على الهاتف وامسح الرمز ضوئياً</p>
      </div>

      <div class="relative flex justify-center items-center my-6">
        <div id="qrcode" class="p-3 bg-white border-2 border-dashed border-indigo-200 rounded-xl"></div>
        <div id="qrOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-xs flex flex-col items-center justify-center hidden rounded-xl">
          <p class="text-sm font-semibold text-rose-500 mb-2">انتهت صلاحية الرمز</p>
          <button onclick="initSession()" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700 shadow-sm transition">
            تحديث الرمز
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-500 px-4">
        <span>صلاحية الرمز:</span>
        <span id="timerText" class="font-bold text-indigo-600">60 ثانية</span>
      </div>
    </div>
  </div>

  <!-- 2. لوحة التحكم بعد نجاح المصادقة -->
  <div id="dashboardScreen" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="font-bold text-lg text-slate-800">لوحة بيانات Metrix - متصل بالهاتف</h1>
      </div>
      <button onclick="logout()" class="px-4 py-2 bg-rose-50 text-rose-600 text-sm font-semibold rounded-lg hover:bg-rose-100 transition">
        تسجيل الخروج
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
      <!-- الإحصائيات -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
          <p class="text-sm text-slate-500">إجمالي المشاريع</p>
          <h3 id="projectsCount" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
          <p class="text-sm text-slate-500">إجمالي بنود الحصر</p>
          <h3 id="itemsCount" class="text-3xl font-bold text-indigo-600 mt-1">0</h3>
        </div>
      </div>

      <!-- جدول المشاريع وبنود الكميات -->
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
          <h2 class="font-bold text-slate-800">بيانات المشاريع وحصر الكميات</h2>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md font-medium">محدثة ومزامنة مباشرة</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-right text-sm">
            <thead class="bg-slate-100/70 text-slate-600 border-b border-slate-200">
              <tr>
                <th class="px-6 py-3">اسم المشروع</th>
                <th class="px-6 py-3">البند</th>
                <th class="px-6 py-3">الوحدة</th>
                <th class="px-6 py-3">الكمية</th>
                <th class="px-6 py-3">ملاحظات</th>
              </tr>
            </thead>
            <tbody id="dataTableBody" class="divide-y divide-slate-100">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    let socket;
    let currentSessionId = '';
    let countdownInterval;
    const SESSION_EXPIRY = 60;

    function initSocket() {
      socket = io();

      socket.on('authenticated', (data) => {
        clearInterval(countdownInterval);
        showDashboard(data);
      });

      socket.on('session_terminated', () => {
        logout();
      });
    }

    function initSession() {
      currentSessionId = 'metrix_' + Math.random().toString(36).substring(2, 10) + Date.now();
      socket.emit('join_session', currentSessionId);

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: JSON.stringify({ type: 'METRIX_AUTH', sessionId: currentSessionId }),
        width: 220,
        height: 220,
        colorDark: "#1e293b",
        colorLight: "#ffffff"
      });

      document.getElementById('qrOverlay').classList.add('hidden');
      startTimer();
    }

    function startTimer() {
      clearInterval(countdownInterval);
      let timeLeft = SESSION_EXPIRY;
      const timerText = document.getElementById('timerText');
      timerText.textContent = `${timeLeft} ثانية`;

      countdownInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = `${timeLeft} ثانية`;
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          document.getElementById('qrOverlay').classList.remove('hidden');
        }
      }, 1000);
    }

    function showDashboard(payload) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');

      const projects = payload.projects || [];
      document.getElementById('projectsCount').textContent = projects.length;

      let totalItems = 0;
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';

      projects.forEach(project => {
        const items = project.items || [];
        totalItems += items.length;

        if (items.length === 0) {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3 font-semibold text-slate-800">${project.name || 'بدون اسم'}</td>
              <td colspan="4" class="px-6 py-3 text-slate-400">لا توجد بنود حصر</td>
            </tr>
          `;
        } else {
          items.forEach(item => {
            tbody.innerHTML += `
              <tr class="hover:bg-slate-50">
                <td class="px-6 py-3 font-semibold text-slate-800">${project.name || '-'}</td>
                <td class="px-6 py-3 font-medium text-slate-700">${item.title || item.name || '-'}</td>
                <td class="px-6 py-3">${item.unit || '-'}</td>
                <td class="px-6 py-3 font-mono font-bold text-indigo-600">${item.quantity || 0}</td>
                <td class="px-6 py-3 text-slate-500">${item.notes || '-'}</td>
              </tr>
            `;
          });
        }
      });

      document.getElementById('itemsCount').textContent = totalItems;
    }

    function logout() {
      if (socket && currentSessionId) {
        socket.emit('terminate_session', currentSessionId);
      }
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
      initSession();
    }

    window.onload = () => {
      initSocket();
      initSession();
    };
  </script>
</body>
</html>
